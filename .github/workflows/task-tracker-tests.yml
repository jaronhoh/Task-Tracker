name: Task Tracker API Tests

concurrency:
  group: task-tracker-tests-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'app/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/task-tracker-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/task-tracker-tests.yml'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check JavaScript syntax
        run: |
          node --check app/server.js
          node --check app/test/api.test.js
          node --check app/test/ui.test.js
      - name: Type check and build React frontend
        run: pnpm run build
      - name: React frontend regression tests
        run: pnpm run test:frontend
      - name: Run API tests
        run: pnpm test
      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser acceptance tests
        run: pnpm run test:ui

