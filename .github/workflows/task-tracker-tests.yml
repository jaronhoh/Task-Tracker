name: Task Tracker API Tests

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/task-tracker-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/task-tracker-tests.yml'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json
      - name: Install dependencies
        run: npm install
      - name: Run API tests
        run: npm test
