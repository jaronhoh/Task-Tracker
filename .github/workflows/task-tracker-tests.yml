name: Task Tracker API Tests

concurrency:
  group: task-tracker-tests-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'app/**'
      - 'package.json'
      - '.github/workflows/task-tracker-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/task-tracker-tests.yml'

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: |
          node --check app/server.js
          node --check app/public/app.js
          node --check app/test/api.test.js
          node --check app/test/ui.test.js
      - name: Run API tests
        run: npm test
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance tests
        run: npm run test:ui
